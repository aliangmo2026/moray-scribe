# moray-scribe 开箱即用：一条命令起 Web UI，模型继续用宿主机的 Ollama。
#
#   docker compose up --build
#   → http://localhost:8000 （把要分析的项目挂到 /work）
#
# 模型不出本机：容器里的 chat 请求走 host.docker.internal 回宿主机 Ollama。
# 换 Ollama 地址：OLLAMA_HOST=http://192.168.1.10:11434 docker compose up

services:
  moray-viewer:
    build: .
    image: moray-scribe:0.5.0
    container_name: moray-scribe-viewer
    ports:
      # 宿主机 8000 被占用时：MORAY_PORT=8010 docker compose up
      - "${MORAY_PORT:-8000}:8000"
    volumes:
      # 要分析的项目（默认 = 自带的 flask_demo 演示；换你的项目改这一行，
      # 例如 - "C:\\code\\my-legacy-app:/work:ro" 或 - "./my-legacy-app:/work:ro"）
      - ./examples/flask_demo:/work:ro
      # 图谱/文档产物：
      - moray-data:/data
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      MORAY_PROJECT: ${MORAY_PROJECT:-/work}
    extra_hosts:
      # Linux 上让 host.docker.internal 指向宿主机（Docker Desktop 原生支持）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  moray-data:
